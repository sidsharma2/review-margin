name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: Smoke test the converter
        run: python -c "import pymupdf, margin_core as m; d=pymupdf.open(); d.new_page(width=612,height=792).insert_text((72,72),'hi'); o=m.build(d, m.Options()); assert o[0].rect.width > o[0].rect.height"
      - run: python build.py
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Review Margin.app" ../ReviewMargin-mac.zip
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Review Margin" -DestinationPath ReviewMargin-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReviewMargin-${{ runner.os }}
          path: ReviewMargin-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReviewMargin-*.zip
